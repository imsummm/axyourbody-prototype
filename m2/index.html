    const weekdayContainer = document.getElementById('weekday-picker');

        btn.addEventListener('click', () => {
          weekdayContainer.querySelectorAll('button').forEach(b => {
            b.className = 'flex-1 py-2 text-center rounded-full bg-surface-container-lowest text-secondary font-label-sm text-caption transition-all cursor-pointer';

          btn.className = 'flex-1 py-2 text-center rounded-full bg-on-surface text-surface-container-lowest font-label-sm text-caption font-semibold transition-all cursor-pointer';
        });
      });
    }

    // Sleep chips toggle interactions
    const sleepContainer = document.getElementById('sleep-chips');
    const sleepIndicator = document.getElementById('sleep-saved-indicator');
    if (sleepContainer) {
      sleepContainer.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          sleepContainer.querySelectorAll('button').forEach(b => {
            b.className = 'px-3.5 py-2 rounded-full bg-surface-container-lowest text-secondary font-label-sm text-caption whitespace-nowrap cursor-pointer transition-colors';
          });
          btn.className = 'px-3.5 py-2 rounded-full bg-on-surface text-surface-container-lowest font-label-sm text-caption font-semibold whitespace-nowrap cursor-pointer transition-colors';
          if (sleepIndicator) {
            sleepIndicator.textContent = '기록 완료';
            sleepIndicator.classList.add('text-primary-container');
          }
        });
      });
    }

    // Condition scale toggle interactions
    const condContainer = document.getElementById('condition-scale');
    const condFeedback = document.getElementById('condition-feedback');
    const labels = {
      '1': '지친 느낌',
      '2': '조금 피곤함',
      '3': '보통의 컨디션',
      '4': '편안함',
      '5': '가뿐하고 상쾌함'
    };
    if (condContainer) {
      condContainer.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          condContainer.querySelectorAll('button').forEach(b => {
            b.className = 'py-2.5 rounded-xl bg-surface-container-lowest text-secondary font-label-md text-label-md flex flex-col items-center justify-center cursor-pointer transition-colors';
          });
          btn.className = 'py-2.5 rounded-xl bg-on-surface text-surface-container-lowest font-label-md text-label-md font-semibold flex flex-col items-center justify-center cursor-pointer transition-colors';
          const val = btn.getAttribute('data-val');
          if (condFeedback && labels[val]) {
            condFeedback.textContent = labels[val];
          }
        });
      });
    }
  })();

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AX YOUR BODY · 운동 · 했어요</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind-config.js"></script>
<script src="../assets/app.js" defer></script>
</head>
<body class="bg-canvas text-body font-sans min-h-screen">
<header class="sticky top-0 z-40 bg-canvas border-b border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-2 flex items-center gap-2">
    <button type="button" data-action="back" data-to="5" aria-label="뒤로" class="w-12 h-12 rounded-full text-ink flex items-center justify-center active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-back"/></svg></button>
    <span class="text-button text-mute">운동 · 했어요</span>
  </div>
</header>

<main class="max-w-[480px] mx-auto px-4 pt-8 pb-8">
  <section class="text-center">
    <span class="mx-auto w-16 h-16 rounded-full bg-ink text-white flex items-center justify-center"><svg class="w-8 h-8" aria-label="했어요"><use href="../assets/icons.svg#i-check"/></svg></span>
    <h1 class="text-title text-ink mt-4">했어요</h1>
    <p id="dn-name" class="text-heading-sm text-ink mt-2">목·어깨 풀기 스트레칭 · 20분 14초</p>
    <p id="dn-note" class="text-body text-mute mt-2">5일 쉬고 다시 시작한 첫 운동이에요. 이번 주 운동에 "했어요"로 남겼어요.</p>
  </section>

  <div class="mt-6 rounded-md bg-card p-4 flex items-center gap-4">
    <img class="w-16 h-16 rounded-md object-cover shrink-0" src="../assets/img/folded-mat.jpg" alt="나무 바닥 위에 접어 둔 운동 매트"/>
    <div class="min-w-0">
      <p class="text-caption text-mute">이번 주 운동</p>
      <p class="text-heading-sm text-ink">2번 했어요</p>
      <p class="text-body-sm text-mute">월요일, 그리고 오늘(일)</p>
    </div>
  </div>

  <section class="mt-6 rounded-lg bg-card p-6">
    <p class="text-button text-ink">오늘 운동은 어땠나요?</p>
    <div class="mt-3 grid grid-cols-3 gap-2" data-group="done-feel" data-keep data-on="bg-ink text-white active:bg-dark" data-off="bg-canvas text-ink active:bg-secondary">
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">가벼웠어요</button>
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">딱 좋았어요</button>
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">힘들었어요</button>
    </div>
    <p class="text-button text-ink mt-6">아직 뻐근한 곳이 있나요?</p>
    <div class="mt-3 grid grid-cols-4 gap-2" data-group="done-sore" data-keep data-on="bg-ink text-white active:bg-dark" data-off="bg-canvas text-ink active:bg-secondary">
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">없어요</button>
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">목</button>
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">어깨</button>
      <button type="button" data-action="pick" aria-pressed="false" class="py-3 rounded-full bg-canvas text-ink text-caption active:bg-secondary">허리</button>
    </div>
    <p class="text-caption text-mute mt-4">고른 답은 다음 "따라 할 운동"을 고를 때 참고로 보여 드려요.</p>
  </section>

  <a href="../m1/" data-path="today-home" class="mt-6 w-full py-4 rounded-md bg-primary text-white text-button flex items-center justify-center gap-2 active:bg-primary-pressed">오늘로 돌아가기<svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-chevron"/></svg></a>
</main>

</body>
</html>

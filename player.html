<script>
    (function () {
      const btn = document.getElementById('play-pause-btn');
      let paused = false;
      btn.addEventListener('click', () => {
        paused = !paused;
        btn.querySelector('span').textContent = paused ? '계속하기' : '일시정지';
      });
      const soundBtn = document.getElementById('sound-toggle');
      let soundOn = true;
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.querySelector('span').textContent = soundOn ? '음성 ON' : '음성 OFF';
      });
    })();
  </script>

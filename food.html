<script>
    (function () {
      document.querySelectorAll('.food-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const group = chip.dataset.group;
          document.querySelectorAll('.food-chip[data-group="' + group + '"]').forEach((btn) => {
            btn.setAttribute('aria-pressed', 'false');
            btn.classList.remove('bg-ink', 'text-on-dark');
            btn.classList.add('bg-surface-card', 'text-ink');
          });
          chip.setAttribute('aria-pressed', 'true');
          chip.classList.remove('bg-surface-card', 'text-ink');
          chip.classList.add('bg-ink', 'text-on-dark');
        });
      });
    })();
  </script>

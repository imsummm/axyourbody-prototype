      언제든 멈추셔도 괜찮아요. 지금까지 진행한 시간도 소중히 보관됩니다.

<script>
  (function() {
    let secondsLeft = 42;
    let isPaused = false;
    const timerEl = document.getElementById('timer-display');
    const breathEl = document.getElementById('breath-guide');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseText = document.getElementById('pause-text');
    const pauseIcon = document.getElementById('pause-icon');

    const breathCues = [
      '천천히 숨을 내쉬며 긴장을 풀어주세요',
      '코로 편안하게 숨을 들이마십니다',
      '어깨 힘을 빼고 턱의 정렬을 느껴보세요'
    ];
    let cueIndex = 0;

    const interval = setInterval(function() {
      if (isPaused) return;
      if (secondsLeft > 0) {
        secondsLeft--;
        const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const secs = String(secondsLeft % 60).padStart(2, '0');
        if (timerEl) timerEl.textContent = mins + ':' + secs;

        if (secondsLeft % 10 === 0 && breathEl) {
          cueIndex = (cueIndex + 1) % breathCues.length;
          breathEl.style.opacity = '0';
          setTimeout(function() {
            breathEl.textContent = breathCues[cueIndex];
            breathEl.style.opacity = '1';
          }, 350);
        }
      } else {
        clearInterval(interval);
      }
    }, 1000);

    if (pauseBtn) {
      pauseBtn.addEventListener('click', function() {
        isPaused = !isPaused;
        if (isPaused) {
          pauseText.textContent = '다시 시작';
          pauseIcon.textContent = 'play_arrow';
          if (breathEl) breathEl.textContent = '잠시 호흡을 고르고 계세요';
        } else {
          pauseText.textContent = '잠깐 멈추기';
          pauseIcon.textContent = 'pause';
          if (breathEl) breathEl.textContent = breathCues[cueIndex];
        }
      });
    }
  })();

<script>
    (function () {
      document.querySelectorAll('.body-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const pressed = chip.getAttribute('aria-pressed') === 'true';
          chip.setAttribute('aria-pressed', pressed ? 'false' : 'true');
          if (pressed) {
            chip.classList.remove('bg-ink', 'text-on-dark');
            chip.classList.add('bg-surface-card', 'text-ink');
          } else {
            chip.classList.remove('bg-surface-card', 'text-ink');
            chip.classList.add('bg-ink', 'text-on-dark');
          }
        });
      });
    })();
  </script>

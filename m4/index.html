<script>
  (function() {
    function setupToggleGroup(containerId, activeClass, inactiveClass) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const buttons = container.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.className = inactiveClass;
            const check = b.querySelector('.material-symbols-outlined');
            if (check) check.remove();
          });
          btn.className = activeClass;
          if (containerId === 'recent-food-group') {
            const icon = document.createElement('span');
            icon.className = 'material-symbols-outlined text-[16px]';
            icon.textContent = 'check';
            btn.prepend(icon);
          }
        });
      });
    }

    setupToggleGroup(
      'meal-time-group',
      'meal-time-btn px-4 py-2 rounded-full font-label-sm text-caption bg-on-surface text-surface-container-lowest font-semibold transition-all select-none',

    );

    );

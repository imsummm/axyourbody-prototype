<script>
    (function () {
      document.querySelectorAll('.lib-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.lib-chip').forEach((b) => {
            b.setAttribute('aria-pressed', 'false');
            b.classList.remove('bg-ink', 'text-on-dark');
            b.classList.add('bg-surface-card', 'text-ink');
          });
          chip.setAttribute('aria-pressed', 'true');
          chip.classList.remove('bg-surface-card', 'text-ink');
          chip.classList.add('bg-ink', 'text-on-dark');
        });
      });
    })();
  </script>

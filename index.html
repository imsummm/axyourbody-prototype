<script>
    (function () {
      document.querySelectorAll('.checkin-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const group = chip.dataset.group;
          document.querySelectorAll('.checkin-chip[data-group="' + group + '"]').forEach((btn) => {
            btn.setAttribute('aria-pressed', 'false');
            btn.classList.remove('bg-ink', 'text-on-dark');
            btn.classList.add('bg-canvas', 'text-ink');
          });
          chip.setAttribute('aria-pressed', 'true');
          chip.classList.remove('bg-canvas', 'text-ink');
          chip.classList.add('bg-ink', 'text-on-dark');
          if (group === 'sleep') document.getElementById('sleep-val').textContent = chip.dataset.value;
          if (group === 'cond') document.getElementById('cond-val').textContent = chip.dataset.value;
        });
      });

      const selectPin = (pin) => {
        document.querySelectorAll('.pin-select').forEach((p) => {
          p.classList.remove('border-2', 'border-ink');
          p.setAttribute('aria-pressed', 'false');
        });
        pin.classList.add('border-2', 'border-ink');
        pin.setAttribute('aria-pressed', 'true');
      };

      document.querySelectorAll('.pin-select').forEach((pin) => {
        pin.addEventListener('click', () => selectPin(pin));
        pin.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectPin(pin);
          }
        });
      });
    })();
  </script>

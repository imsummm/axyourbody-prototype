<!-- 1. 뻐근한 부위 (Multi-select) -->

<span data-design-text-token="button-md">목·어깨</span>
</button>
<button aria-pressed="false" class="cond-multi bg-canvas text-ink font-button text-button-md rounded-full px-lg py-sm transition-transform duration-press-scale active:scale-95" type="button">
<span data-design-text-token="button-md">허리</span>
</button>
<button aria-pressed="false" class="cond-multi bg-canvas text-ink font-button text-button-md rounded-full px-lg py-sm transition-transform duration-press-scale active:scale-95" type="button">
<span data-design-text-token="button-md">눈 피로</span>
</button>

</div>

<script>
    (function () {
      document.querySelectorAll('.cond-multi').forEach((chip) => {
        chip.addEventListener('click', () => {
          const pressed = chip.getAttribute('aria-pressed') === 'true';
          chip.setAttribute('aria-pressed', pressed ? 'false' : 'true');
          chip.classList.toggle('bg-ink', !pressed);
          chip.classList.toggle('text-on-dark', !pressed);
          chip.classList.toggle('bg-canvas', pressed);
          chip.classList.toggle('text-ink', pressed);
        });
      });

      document.querySelectorAll('.stress-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.stress-chip').forEach((b) => {
            b.classList.remove('bg-ink', 'text-on-dark');
            b.classList.add('bg-canvas', 'text-ink');
          });
          chip.classList.remove('bg-canvas', 'text-ink');
          chip.classList.add('bg-ink', 'text-on-dark');
          document.getElementById('stress-val').textContent = chip.dataset.val;
        });
      });
    })();
  </script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AX YOUR BODY · 먹은 것 · 빠른 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind-config.js"></script>
<script src="../assets/app.js" defer></script>
</head>
<body class="bg-canvas text-body font-sans min-h-screen">
<header class="fixed top-0 inset-x-0 z-40 bg-canvas border-b border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span role="img" aria-label="AX YOUR BODY" class="w-8 h-8 rounded-full bg-primary text-white text-caption font-bold flex items-center justify-center">AX</span>
      <h1 class="text-title-sm text-ink">오늘</h1>
    </div>
    <a href="../m13/" data-path="settings-notifications" aria-label="설정과 알림 (my-f-general)" class="w-12 h-12 rounded-full flex items-center justify-center active:bg-card">
      <span class="w-8 h-8 rounded-full bg-card text-ink flex items-center justify-center"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-settings"/></svg></span>
    </a>
  </div>
</header>

<main class="max-w-[480px] mx-auto px-4 pt-16 pb-16">
  <section class="pt-6">
    <p class="text-caption text-mute">수요일 밤 11시 10분</p>
    <p class="text-title text-ink mt-1">오늘 운동은 아직이에요</p>
    <p class="text-body-sm text-mute mt-2">오늘 먹은 것 2개 · 점심 김치찌개와 공깃밥 · 저녁 리코타 닭가슴살 샐러드</p>
  </section>
</main>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-canvas border-t border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-3 flex items-center justify-around">
    <a href="../m1/" data-path="today" aria-current="page" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-ink font-semibold active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-home"/></svg><span class="text-caption">오늘</span><span class="w-4 h-1 rounded-full bg-primary"></span></a>
    <a href="../m5/" data-path="workout" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-workout"/></svg><span class="text-caption">운동</span></a>
    <a href="../m10/" data-path="nourishment" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-meal"/></svg><span class="text-caption">먹은 것</span></a>
    <a href="../m11/" data-path="body-evolution" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-body"/></svg><span class="text-caption">몸 변화</span></a>
  </div>
</nav>

<div class="fixed inset-0 z-50">
  <div data-action="back" data-to="1" class="absolute inset-0 bg-black/50"></div>
  <section data-meal-form class="absolute bottom-0 inset-x-0 max-w-[480px] mx-auto bg-canvas rounded-t-lg p-6 flex flex-col gap-6">
    <div class="flex items-center justify-between">
      <h2 class="text-heading text-ink">먹은 것 · 밤 11:10</h2>
      <button type="button" data-action="back" data-to="1" aria-label="닫기" class="w-12 h-12 rounded-full bg-card text-ink flex items-center justify-center active:bg-secondary"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-close"/></svg></button>
    </div>

    <div>
      <p class="text-button text-ink">먹은 때</p>
      <p class="text-caption text-mute mt-1">지금 시각 기준으로 골라 뒀어요</p>
      <div class="mt-2 flex flex-wrap gap-2" data-group="fq-when" data-on="bg-ink text-white font-semibold active:bg-dark" data-off="bg-card text-ink active:bg-secondary">
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">아침</button>
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">점심</button>
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">저녁</button>
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">간식</button>
        <button type="button" data-action="pick" aria-pressed="true" class="px-4 py-2 rounded-full bg-ink text-white text-caption font-semibold active:bg-dark">야식</button>
      </div>
    </div>

    <div>
      <p class="text-button text-ink">어떻게 먹었나요</p>
      <div class="mt-2 grid grid-cols-3 gap-2" data-group="fq-how" data-on="bg-ink text-white font-semibold active:bg-dark" data-off="bg-card text-ink active:bg-secondary">
        <button type="button" data-action="pick" aria-pressed="false" class="py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">집밥</button>
        <button type="button" data-action="pick" aria-pressed="false" class="py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">외식</button>
        <button type="button" data-action="pick" aria-pressed="true" class="py-2 rounded-full bg-ink text-white text-caption font-semibold active:bg-dark">배달</button>
      </div>
    </div>

    <div>
      <p class="text-button text-ink">최근 · 자주 먹은 메뉴</p>
      <p class="text-caption text-mute mt-1">여러 개를 고를 수 있어요</p>
      <div class="mt-2 flex flex-wrap gap-2" data-group="fq-menu" data-multi data-on="bg-ink text-white font-semibold active:bg-dark" data-off="bg-card text-ink active:bg-secondary">
        <button type="button" data-action="pick" aria-pressed="true" class="px-4 py-2 rounded-full bg-ink text-white text-caption font-semibold active:bg-dark">떡볶이</button>
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">치킨</button>
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">편의점 컵라면</button>
        <button type="button" data-action="pick" aria-pressed="false" class="px-4 py-2 rounded-full bg-card text-ink text-caption active:bg-secondary">김밥</button>
      </div>
      <label class="mt-3 h-12 rounded-full bg-card px-4 flex items-center gap-2 text-mute">
        <svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-search"/></svg>
        <input type="text" data-action="food-search" data-meal-text aria-label="메뉴 검색 또는 직접 입력" placeholder="메뉴 검색 또는 직접 입력" class="flex-1 bg-transparent text-body-sm text-ink outline-none"/>
      </label>
    </div>

    <p class="text-caption text-mute">칼로리나 무게 없이 메뉴만 남겨요.</p>
    <button type="button" data-action="save-meal" class="w-full py-4 rounded-md bg-primary text-white text-button flex items-center justify-center gap-2 active:bg-primary-pressed">저장<svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-check"/></svg></button>
  </section>
</div>

</body>
</html>

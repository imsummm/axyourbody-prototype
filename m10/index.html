<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AX YOUR BODY · 먹은 것 · 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind-config.js"></script>
</head>
<body class="bg-canvas text-body font-sans min-h-screen">
<header class="sticky top-0 z-40 bg-canvas border-b border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-4 flex items-center justify-between">
    <h1 class="text-title-sm text-ink">먹은 것</h1>
    <a href="#" data-path="settings-notifications" aria-label="설정과 알림 (my-f-general)" class="w-12 h-12 rounded-full flex items-center justify-center active:bg-card">
      <span class="w-8 h-8 rounded-full bg-card text-ink flex items-center justify-center"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-settings"/></svg></span>
    </a>
  </div>
</header>

<main class="max-w-[480px] mx-auto px-4 pt-6 pb-16">
  <section class="rounded-md bg-card p-4 flex items-center gap-4">
    <img class="w-16 h-16 rounded-md object-cover shrink-0" src="../assets/img/m10-bg1.jpg" alt="나무 식탁 위 따뜻한 국그릇 하나"/>
    <div class="min-w-0">
      <p class="text-caption text-mute">나의 먹는 다짐</p>
      <p class="text-heading-sm text-ink mt-1">"야근한 날도 먹은 건 가볍게 남기기"</p>
    </div>
  </section>

  <div class="mt-6 flex items-center justify-between">
    <button type="button" aria-label="이전 날" class="w-12 h-12 rounded-full text-ink flex items-center justify-center active:bg-card"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-back"/></svg></button>
    <span class="text-button text-ink">오늘 · 수요일</span>
    <button type="button" aria-label="다음 날" class="w-12 h-12 rounded-full text-ink flex items-center justify-center active:bg-card"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-chevron"/></svg></button>
  </div>

  <button type="button" data-path="nourishment-add" class="mt-4 w-full py-4 rounded-md bg-primary text-white text-button flex items-center justify-center gap-2 active:bg-primary-pressed"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-plus"/></svg>먹은 것 남기기</button>

  <div class="mt-6 flex flex-col" role="list">
    <div role="listitem" class="py-4 border-b border-hairline">
      <div class="flex items-center justify-between">
        <span class="text-caption text-mute">점심 · 12:30 · 외식</span>
      </div>
      <h3 class="text-heading-sm text-ink mt-1">김치찌개와 공깃밥</h3>
      <p class="text-body-sm text-mute mt-1">회사 근처 한식당에서 동료들과</p>
    </div>
    <div role="listitem" class="py-4 border-b border-hairline">
      <div class="flex items-center justify-between">
        <span class="text-caption text-mute">저녁 · 19:40 · 배달</span>
      </div>
      <h3 class="text-heading-sm text-ink mt-1">리코타 닭가슴살 샐러드</h3>
      <p class="text-body-sm text-mute mt-1">야근 중 회사에서</p>
    </div>
    <div role="listitem" class="py-4">
      <div class="flex items-center justify-between">
        <span class="text-caption text-mute">야식 · 23:10 · 배달</span>
      </div>
      <h3 class="text-heading-sm text-ink mt-1">국물 떡볶이</h3>
      <p class="text-body-sm text-mute mt-1">퇴근 후 집에서</p>
    </div>
  </div>

  <p class="text-caption text-mute text-center pt-6 pb-4">칼로리 계산 없이 메뉴와 먹은 때만 남겨요.</p>
</main>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-canvas border-t border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-3 flex items-center justify-around">
    <a href="#" data-path="today" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-home"/></svg><span class="text-caption">오늘</span></a>
    <a href="#" data-path="workouts" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-workout"/></svg><span class="text-caption">운동</span></a>
    <a href="#" data-path="nourishment" aria-current="page" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-ink font-semibold active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-meal"/></svg><span class="text-caption">먹은 것</span><span class="w-4 h-1 rounded-full bg-primary"></span></a>
    <a href="#" data-path="body-evolution" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-body"/></svg><span class="text-caption">몸 변화</span></a>
  </div>
</nav>
</body>
</html>

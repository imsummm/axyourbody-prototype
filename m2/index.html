<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AX YOUR BODY · 오늘 · 다시 시작하는 일요일</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind-config.js"></script>
<script src="../assets/app.js" defer></script>
</head>
<body class="bg-canvas text-body font-sans min-h-screen">
<header class="fixed top-0 inset-x-0 z-40 bg-canvas border-b border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span role="img" aria-label="AX YOUR BODY" class="w-8 h-8 rounded-full bg-primary text-white text-caption font-bold flex items-center justify-center">AX</span>
      <h1 class="text-title-sm text-ink">오늘</h1>
    </div>
    <a href="../m13/" data-path="settings-notifications" aria-label="설정과 알림 (my-f-general)" class="w-12 h-12 rounded-full flex items-center justify-center active:bg-card">
      <span class="w-8 h-8 rounded-full bg-card text-ink flex items-center justify-center"><svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-settings"/></svg></span>
    </a>
  </div>
</header>

<main class="max-w-[480px] mx-auto px-4 pt-16 pb-16">
  <section class="mt-6 rounded-lg bg-card p-6">
    <p class="text-caption text-mute">일요일 · 마지막 운동 월요일</p>
    <h2 class="text-title text-ink mt-2">5일 쉬었어요.<br/>오늘은 가볍게 해 볼까요?</h2>

    <div class="mt-4 rounded-md bg-canvas overflow-hidden">
      <div class="relative h-36">
        <img class="w-full h-full object-cover" src="../assets/img/neck-stretch-room.jpg" alt="햇빛 드는 방에서 목과 어깨를 천천히 늘리는 사람"/>
        <span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-canvas text-caption text-ink">20분</span>
      </div>
      <div class="p-4">
        <h3 class="text-heading-sm text-ink">목·어깨 풀기 스트레칭</h3>
        <p class="text-body-sm text-mute mt-1">앉아서 굳은 목 앞쪽을 늘려 줘요. 평소 25분 루틴 대신 20분짜리로 줄였어요.</p>
      </div>
    </div>

    <a href="../m8/?r=neck" data-path="workout-in-progress" class="mt-4 w-full py-4 rounded-md bg-primary text-white text-button flex items-center justify-center active:bg-primary-pressed">시작하기</a>
    <button type="button" data-action="go" data-to="1" class="mt-2 w-full py-2 rounded-md text-body-sm text-mute active:bg-secondary">나중에</button>
    <p class="text-caption text-mute text-center mt-1">중간에 멈춰도 "여기까지 했어요"로 남아요</p>

    <div class="mt-4 pt-4 border-t border-hairline">
      <p class="text-button text-ink">다음 주 하루 고르기</p>
      <p class="text-caption text-mute mt-1">야근이 적은 날 하나만 골라 두면 그날 할 운동으로 넣어 둘게요.</p>
      <div class="mt-3 grid grid-cols-5 gap-2" data-group="p2-nextday" data-keep data-on="bg-ink text-white font-semibold active:bg-dark" data-off="bg-canvas text-ink active:bg-secondary">
        <button type="button" data-action="pick" data-value="월" data-name="월요일" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">월</button>
        <button type="button" data-action="pick" data-value="화" data-name="화요일" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">화</button>
        <button type="button" data-action="pick" data-value="수" data-name="수요일" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">수</button>
        <button type="button" data-action="pick" data-value="목" data-name="목요일" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">목</button>
        <button type="button" data-action="pick" data-value="금" data-name="금요일" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">금</button>
      </div>
    </div>
  </section>

  <section class="mt-4 rounded-lg bg-card p-6 flex flex-col gap-6">
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-heading-sm text-ink">어젯밤 잠</span>
        <span class="text-caption text-mute" id="sleep-label">7시간</span>
      </div>
      <div class="grid grid-cols-4 gap-2" data-group="p2-sleep" data-keep data-label="sleep-label" data-on="bg-ink text-white font-semibold active:bg-dark" data-off="bg-canvas text-ink active:bg-secondary">
        <button type="button" data-action="pick" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">5시간 이하</button>
        <button type="button" data-action="pick" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">6시간</button>
        <button type="button" data-action="pick" aria-pressed="true" class="py-2 rounded-full bg-ink text-white text-caption font-semibold active:bg-dark">7시간</button>
        <button type="button" data-action="pick" aria-pressed="false" class="py-2 rounded-full bg-canvas text-ink text-caption active:bg-secondary">8시간 이상</button>
      </div>
    </div>
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-heading-sm text-ink">오늘 몸 상태</span>
        <span class="text-caption text-mute" id="condition-feedback">좋음 (4)</span>
      </div>
      <div class="grid grid-cols-5 gap-2" data-group="p2-body" data-keep data-label="condition-feedback" data-on="bg-ink text-white active:bg-dark" data-off="bg-canvas text-ink active:bg-secondary">
        <button type="button" data-action="pick" data-value="1" data-name="매우 나쁨 (1)" aria-pressed="false" class="py-3 rounded-md bg-canvas text-ink text-button active:bg-secondary">1</button>
        <button type="button" data-action="pick" data-value="2" data-name="나쁨 (2)" aria-pressed="false" class="py-3 rounded-md bg-canvas text-ink text-button active:bg-secondary">2</button>
        <button type="button" data-action="pick" data-value="3" data-name="보통 (3)" aria-pressed="false" class="py-3 rounded-md bg-canvas text-ink text-button active:bg-secondary">3</button>
        <button type="button" data-action="pick" data-value="4" data-name="좋음 (4)" aria-pressed="true" class="py-3 rounded-md bg-ink text-white text-button active:bg-dark">4</button>
        <button type="button" data-action="pick" data-value="5" data-name="매우 좋음 (5)" aria-pressed="false" class="py-3 rounded-md bg-canvas text-ink text-button active:bg-secondary">5</button>
      </div>
      <div class="flex justify-between mt-2 text-caption text-mute"><span>매우 나쁨</span><span>보통</span><span>매우 좋음</span></div>
    </div>
  </section>

  <a href="../m7/?r=core" data-path="routine-detail" class="mt-4 rounded-lg bg-card p-6 flex items-center justify-between active:bg-secondary">
    <span>
      <span class="block text-caption text-mute">평소 하던 운동</span>
      <span class="block text-heading-sm text-ink">코어·자세 루틴 · 25분</span>
    </span>
    <svg class="w-6 h-6 text-mute" aria-hidden="true"><use href="../assets/icons.svg#i-chevron"/></svg>
  </a>

  <a href="../m4/" data-path="nourishment-log" class="mt-4 mb-6 w-full py-4 rounded-md bg-secondary text-ink text-button flex items-center justify-center gap-2 active:bg-secondary-pressed">
    <svg class="w-5 h-5" aria-hidden="true"><use href="../assets/icons.svg#i-plus"/></svg>먹은 것
  </a>
</main>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-canvas border-t border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-3 flex items-center justify-around">
    <a href="../m1/" data-path="today" aria-current="page" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-ink font-semibold active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-home"/></svg><span class="text-caption">오늘</span><span class="w-4 h-1 rounded-full bg-primary"></span></a>
    <a href="../m5/" data-path="workout" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-workout"/></svg><span class="text-caption">운동</span></a>
    <a href="../m10/" data-path="nourishment" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-meal"/></svg><span class="text-caption">먹은 것</span></a>
    <a href="../m11/" data-path="body-evolution" class="flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 text-mute active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-body"/></svg><span class="text-caption">몸 변화</span></a>
  </div>
</nav>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AX YOUR BODY · 설정 · 알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind-config.js"></script>
</head>
<body class="bg-canvas text-body font-sans min-h-screen">
<header class="sticky top-0 z-40 bg-canvas border-b border-hairline">
  <div class="h-16 max-w-[480px] mx-auto px-2 flex items-center gap-2">
    <button type="button" id="back-btn" aria-label="뒤로" class="w-12 h-12 rounded-full text-ink flex items-center justify-center active:bg-card"><svg class="w-6 h-6" aria-hidden="true"><use href="../assets/icons.svg#i-back"/></svg></button>
    <h1 class="text-title-sm text-ink">설정 · 알림</h1>
  </div>
</header>

<main class="max-w-[480px] mx-auto px-4 pt-6 pb-8">
  <section class="rounded-lg bg-card p-6 flex items-center gap-4">
    <img class="w-16 h-16 rounded-full object-cover shrink-0" src="../assets/img/profile-portrait-2.jpg" alt="가상 프로필 사진"/>
    <div class="min-w-0">
      <p class="text-heading-sm text-ink">my-f-general</p>
      <p class="text-body-sm text-mute">28세 · 야근이 많은 사무직</p>
      <p class="text-caption text-mute mt-1">목표 · 거북목·어깨 결림 줄이기, 체력 올리기, 주 3회 운동</p>
    </div>
  </section>

  <section class="mt-6">
    <h2 class="text-heading text-ink">알림</h2>
    <p class="text-caption text-mute mt-1">바꾸면 바로 적용돼요</p>
    <div class="mt-2 flex flex-col">
      <div class="py-4 border-b border-hairline flex items-start justify-between gap-4">
        <div><p class="text-button text-ink">운동 알림 (주 3회)</p><p class="text-body-sm text-mute mt-1">할 운동이 있는 날 퇴근 시간 뒤에 한 번 알려 드려요.</p></div>
        <button type="button" role="switch" aria-checked="true" class="switch shrink-0 w-12 h-8 rounded-full bg-ink p-1 active:opacity-100 active:ring-2 active:ring-stone"><span class="toggle-thumb block w-6 h-6 rounded-full bg-white translate-x-4 transition-transform"></span></button>
      </div>
      <div class="py-4 border-b border-hairline flex items-start justify-between gap-4">
        <div><p class="text-button text-ink">먹은 것 알림 (밤 10시)</p><p class="text-body-sm text-mute mt-1">먹은 것을 남길 수 있게 한 번 알려 드려요. 비워 둔 날도 괜찮아요.</p></div>
        <button type="button" role="switch" aria-checked="true" class="switch shrink-0 w-12 h-8 rounded-full bg-ink p-1 active:ring-2 active:ring-stone"><span class="toggle-thumb block w-6 h-6 rounded-full bg-white translate-x-4 transition-transform"></span></button>
      </div>
      <div class="py-4 flex items-start justify-between gap-4">
        <div><p class="text-button text-ink">쉬는 동안 알림 주 1회로 줄이기</p><p class="text-body-sm text-mute mt-1">운동을 쉰 주에는 알림을 줄이고 재촉하지 않아요.</p></div>
        <button type="button" role="switch" aria-checked="true" class="switch shrink-0 w-12 h-8 rounded-full bg-ink p-1 active:ring-2 active:ring-stone"><span class="toggle-thumb block w-6 h-6 rounded-full bg-white translate-x-4 transition-transform"></span></button>
      </div>
    </div>
  </section>

  <section class="mt-6">
    <h2 class="text-heading text-ink">내 정보와 운동 환경</h2>
    <div class="mt-2 flex flex-col">
      <button type="button" class="py-4 border-b border-hairline flex items-center justify-between gap-4 text-left active:bg-card">
        <span><span class="block text-button text-ink">내 정보</span><span class="block text-body-sm text-mute mt-1">my-f-general · 28세 · 거북목·어깨 결림 줄이기, 체력 올리기, 주 3회 운동</span></span>
        <svg class="w-5 h-5 text-mute" aria-hidden="true"><use href="../assets/icons.svg#i-chevron"/></svg>
      </button>
      <button type="button" class="py-4 border-b border-hairline flex items-center justify-between gap-4 text-left active:bg-card">
        <span><span class="block text-button text-ink">운동 장소</span><span class="block text-body-sm text-mute mt-1">집</span></span>
        <svg class="w-5 h-5 text-mute" aria-hidden="true"><use href="../assets/icons.svg#i-chevron"/></svg>
      </button>
      <button type="button" class="py-4 flex items-center justify-between gap-4 text-left active:bg-card">
        <span><span class="block text-button text-ink">기록 보관</span><span class="block text-body-sm text-mute mt-1">이 기기에 저장돼요</span></span>
        <svg class="w-5 h-5 text-mute" aria-hidden="true"><use href="../assets/icons.svg#i-chevron"/></svg>
      </button>
    </div>
  </section>

  <div class="mt-8 flex items-center justify-center gap-2 text-caption text-mute">
    <button type="button" class="px-2 py-1 rounded-sm active:bg-card">이용 약관</button><span>·</span>
    <button type="button" class="px-2 py-1 rounded-sm active:bg-card">개인정보 처리방침</button><span>·</span>
    <button type="button" class="px-2 py-1 rounded-sm active:bg-card">계정 잠시 쉬기</button>
  </div>
</main>

<script>
(function () {
  document.getElementById('back-btn').addEventListener('click', function () { history.back(); });
  document.querySelectorAll('.switch').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-checked') !== 'true';
      b.setAttribute('aria-checked', String(on));
      b.classList.toggle('bg-ink', on); b.classList.toggle('bg-stone', !on);
      var t = b.querySelector('.toggle-thumb');
      t.classList.toggle('translate-x-4', on); t.classList.toggle('translate-x-0', !on);
    });
  });
})();
</script>
</body>
</html>
